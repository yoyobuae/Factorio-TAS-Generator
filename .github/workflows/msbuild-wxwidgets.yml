name: MSBuild-WxWidgets

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  # ... commented for now ...
  push:
    branches: [ msbuild-wxwidgets ]
  #pull_request:
  #  branches: [ master ]

  # Runs this workflow manually from the Actions tab
  workflow_dispatch:

jobs:

  build-windows:

    runs-on: windows-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout Factorio-TAS-Generator
        uses: actions/checkout@v3
        with:
          path: Factorio-TAS-Generator
          submodules: 'true'

      - name: Checkout WX
        uses: actions/checkout@v3
        with:
          repository: WxWidgets/WxWidgets
          ref: v3.3.2
          path: wxWidgets
          submodules: 'true'

      - name: Cache WX 64-bit
        id: cache-wx
        uses: actions/cache@v3
        with:
          path: wxWidgets/lib
          key: wx-3.3.3-build-lib-${{ runner.os }}-3264bit-static-staticrt-${{ hashFiles('wxWidgets/lib/config.log') }}
          restore-keys: |
            wx-3.3.2-build-lib-${{ runner.os }}-3264bit-static-staticrt-

      - name: Munge WX to use static runtime
        if: steps.cache-wx.outputs.cache-hit != 'true'
        run: |
          python "Factorio-TAS-Generator\msw_build_static.py" wxWidgets\build\msw

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v1.0.2

      # Builds WX static library
      - name: Build WX 64-bit
        if: steps.cache-wx.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          msbuild "wxWidgets\build\msw\wx_vc17.sln" /Build "Release|x64"

      # Builds WX static library
      - name: Build WX 32-bit
        if: steps.cache-wx.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          build "wxWidgets\build\msw\wx_vc17.sln" /Build "Release|Win32"

      # Build our program
      - name: Build Factorio-TAS-Generator
        id: build-Factorio-TAS-Generator-x64
        shell: cmd
        run: |
          dir "Factorio-TAS-Generator"
          SET WX_BUILD_DIR=..\..\wxWidgets
          msbuild "Factorio-TAS-Generator\Factorio-TAS-Generator.sln" /Build "Release|x64"
          dir /S "Factorio-TAS-Generator"

      # Build our program
      - name: Build Factorio-TAS-Generator 32-bit
        id: build-Factorio-TAS-Generator-x86
        shell: cmd
        run: |
          dir "Factorio-TAS-Generator"
          SET WX_BUILD_DIR=..\..\wxWidgets
          msbuild "Factorio-TAS-Generator\Factorio-TAS-Generator.sln" /Build "Release|x86"
          dir /S "Factorio-TAS-Generator"

      # Upload the artifacts
      - uses: actions/upload-artifact@v4
        if: steps.build-Factorio-TAS-Generator-x86.outcome == 'success'
        with:
          name: Factorio-TAS-Generator-${{ runner.os }}-64bit-executable-artifact
          path: Factorio-TAS-Generator/*.exe
      - uses: actions/upload-artifact@v4
        if: steps.build-Factorio-TAS-Generator-x86.outcome == 'success'
        with:
          name: Factorio-TAS-Generator-${{ runner.os }}-32bit-executable-artifact
          path: Factorio-TAS-Generator/*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Factorio-TAS-Generator-${{ runner.os }}-error-64bit-log-artifact
          path: Factorio-TAS-Generator/*.log
      - uses: actions/upload-artifact@v4
        with:
          name: Factorio-TAS-Generator-${{ runner.os }}-error-32bit-log-artifact
          path: Factorio-TAS-Generator/*.log

  release-all:
    runs-on: ubuntu-latest
    needs: [ build-windows ]
    steps:
      - run: |
          echo "${{ github.ref_name }}"
      - uses: actions/download-artifact@v3
        with:
          name: Factorio-TAS-Generator-Windows-32bit-executable-artifact
          path: windows-all-versions-32bit-executable-${{ github.ref_name }}
      - uses: actions/download-artifact@v3
        with:
          name: Factorio-TAS-Generator-Windows-64bit-executable-artifact
          path: windows-all-versions-64bit-executable-${{ github.ref_name }}
      - run: |
          ls -lR
          mv windows-all-versions-32bit-executable-${{ github.ref_name }}/Factorio-TAS-Generator*.* ./Factorio-TAS-Generator32.exe
          mv windows-all-versions-64bit-executable-${{ github.ref_name }}/Factorio-TAS-Generator*.* ./Factorio-TAS-Generator.exe
          chmod +x ./Factorio-TAS-Generator*.exe
          ls -l
      - name: Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            Factorio-TAS-Generator*
